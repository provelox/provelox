server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Set here and again where a location sets its own headers (nginx does not inherit them in that case)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # VitePress uses clean URLs: /guide/install is guide/install.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Built assets carry a content hash in their name, so they can be cached for good
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  error_page 404 /404.html;
}
