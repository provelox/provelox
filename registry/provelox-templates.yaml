# A template registry for Provelox: popular apps that need more than one service.
#
# Host this file anywhere that answers a plain GET (a GitHub repository, a bucket, any web server), then add its address
# under Settings → Template registries (or on every server at once through the API).
# For a GitHub repository choose "Git repository", set the file to registry/provelox-templates.yaml.
# How the format works: documentation → Guide → Template registries.
#
# Every database password and secret key below is a "secret" variable: Provelox generates it when someone deploys, so
# nothing is shared between two deployments. Each template's services find each other by the service name (db, redis ...).
name: Provelox popular apps

templates:
  # ---------------------------------------------------------------------------------------------------------------
  - id: wordpress-mariadb
    name: WordPress
    description: "WordPress with its own MariaDB database. Site files and the database are kept on volumes."
    category: Web
    icon: wordpress
    mainService: wordpress
    port: 80
    publicWeb: true
    variables:
      - { key: DB_NAME, label: Database name, default: wordpress }
      - { key: DB_USER, label: Database user, default: wordpress }
      - { key: DB_PASSWORD, label: Database password, kind: secret }
      - { key: DB_ROOT_PASSWORD, label: Database root password, kind: secret }
    compose: |
      services:
        wordpress:
          image: wordpress:6-apache
          restart: unless-stopped
          depends_on: [db]
          environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_NAME: ${DB_NAME}
            WORDPRESS_DB_USER: ${DB_USER}
            WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
          volumes:
            - site:/var/www/html
          x-provelox:
            expose: true
            port: 80
        db:
          image: mariadb:11
          restart: unless-stopped
          environment:
            MARIADB_DATABASE: ${DB_NAME}
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
          volumes:
            - dbdata:/var/lib/mysql
          healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
      volumes:
        site:
        dbdata:

  # ---------------------------------------------------------------------------------------------------------------
  - id: docuseal
    name: DocuSeal
    description: "Open source document signing: fill, sign and send PDF forms. With its own PostgreSQL database."
    category: Productivity
    mainService: docuseal
    port: 3000
    publicWeb: true
    variables:
      - key: DB_PASSWORD
        label: Database password
        kind: secret
      - key: SECRET_KEY_BASE
        label: Secret key
        description: "Signs sessions and encrypts stored values. Generated; keep it if you ever move the data."
        kind: secret
    compose: |
      services:
        docuseal:
          image: docuseal/docuseal:latest
          restart: unless-stopped
          depends_on: [postgres]
          environment:
            DATABASE_URL: postgresql://docuseal:${DB_PASSWORD}@postgres:5432/docuseal
            SECRET_KEY_BASE: ${SECRET_KEY_BASE}
          volumes:
            - data:/data/docuseal
          x-provelox:
            expose: true
            port: 3000
        postgres:
          image: postgres:17
          restart: unless-stopped
          environment:
            POSTGRES_USER: docuseal
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: docuseal
          volumes:
            - pgdata:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U docuseal -d docuseal"]
            interval: 10s
            timeout: 5s
            retries: 10
      volumes:
        data:
        pgdata:

  # ---------------------------------------------------------------------------------------------------------------
  - id: nextcloud
    name: Nextcloud
    description: "Files, calendars, contacts and more on your own server. With MariaDB for data and Redis for locking and caching."
    category: Productivity
    icon: https://cdn.simpleicons.org/nextcloud
    mainService: nextcloud
    port: 80
    publicWeb: true
    variables:
      - key: NEXTCLOUD_ADMIN_USER
        label: Admin username
        default: admin
      - key: NEXTCLOUD_ADMIN_PASSWORD
        label: Admin password
        description: "The first login. Generated; change it in Nextcloud afterwards if you like."
        kind: secret
      - key: NEXTCLOUD_TRUSTED_DOMAINS
        label: Address you will open it at
        description: "The domain, without https:// (for example cloud.example.com). Several can be separated by spaces. Add the domain under the app's Networking after deploying."
        default: localhost
      - { key: DB_PASSWORD, label: Database password, kind: secret }
      - { key: DB_ROOT_PASSWORD, label: Database root password, kind: secret }
      - { key: REDIS_PASSWORD, label: Redis password, kind: secret }
    compose: |
      services:
        nextcloud:
          image: nextcloud:31-apache
          restart: unless-stopped
          depends_on: [db, redis]
          environment:
            MYSQL_HOST: db
            MYSQL_DATABASE: nextcloud
            MYSQL_USER: nextcloud
            MYSQL_PASSWORD: ${DB_PASSWORD}
            REDIS_HOST: redis
            REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
            NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
            NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
            NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
          volumes:
            - html:/var/www/html
          x-provelox:
            expose: true
            port: 80
        db:
          image: mariadb:11
          restart: unless-stopped
          command: ["--transaction-isolation=READ-COMMITTED", "--binlog-format=ROW"]
          environment:
            MARIADB_DATABASE: nextcloud
            MARIADB_USER: nextcloud
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
          volumes:
            - dbdata:/var/lib/mysql
          healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
        redis:
          image: redis:7
          restart: unless-stopped
          command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
          volumes:
            - redisdata:/data
      volumes:
        html:
        dbdata:
        redisdata:

  # ---------------------------------------------------------------------------------------------------------------
  - id: n8n
    name: n8n
    description: "Workflow automation with a visual editor and hundreds of integrations. Runs on PostgreSQL."
    category: Automation
    icon: https://cdn.simpleicons.org/n8n
    mainService: n8n
    port: 5678
    publicWeb: true
    variables:
      - key: N8N_ENCRYPTION_KEY
        label: Encryption key
        description: "Encrypts the credentials n8n stores. Generated. Keep it: without it saved credentials cannot be read."
        kind: secret
      - key: WEBHOOK_URL
        label: Public address (optional)
        description: "Where n8n is reachable from outside, with the final slash (https://n8n.example.com/). Used in webhook URLs. Add the domain under the app's Networking after deploying."
        default: ""
      - key: N8N_SECURE_COOKIE
        label: Secure cookie
        description: "Set to true once it is served over HTTPS. While it is plain HTTP, leave it false or you cannot sign in."
        default: "false"
      - key: GENERIC_TIMEZONE
        label: Time zone
        default: UTC
      - { key: DB_PASSWORD, label: Database password, kind: secret }
    compose: |
      services:
        n8n:
          image: n8nio/n8n:latest
          restart: unless-stopped
          depends_on: [postgres]
          environment:
            DB_TYPE: postgresdb
            DB_POSTGRESDB_HOST: postgres
            DB_POSTGRESDB_PORT: "5432"
            DB_POSTGRESDB_DATABASE: n8n
            DB_POSTGRESDB_USER: n8n
            DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
            N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
            N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
            WEBHOOK_URL: ${WEBHOOK_URL}
            GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
            TZ: ${GENERIC_TIMEZONE}
          volumes:
            - data:/home/node/.n8n
          x-provelox:
            expose: true
            port: 5678
        postgres:
          image: postgres:17
          restart: unless-stopped
          environment:
            POSTGRES_USER: n8n
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: n8n
          volumes:
            - pgdata:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
            interval: 10s
            timeout: 5s
            retries: 10
      volumes:
        data:
        pgdata:

  # ---------------------------------------------------------------------------------------------------------------
  - id: ghost
    name: Ghost
    description: "A modern publishing platform for blogs and newsletters, with a Content API for headless use. With its own MySQL database."
    category: CMS
    icon: https://cdn.simpleicons.org/ghost
    mainService: ghost
    port: 2368
    publicWeb: true
    variables:
      - key: SITE_URL
        label: Address of the site
        description: "The full address people will open, like https://blog.example.com. Ghost builds every link from it, so set it to the real one and add that domain under the app's Networking after deploying."
        default: http://localhost:2368
      - { key: DB_PASSWORD, label: Database password, kind: secret }
      - { key: DB_ROOT_PASSWORD, label: Database root password, kind: secret }
    compose: |
      services:
        ghost:
          image: ghost:5
          restart: unless-stopped
          depends_on: [db]
          environment:
            url: ${SITE_URL}
            database__client: mysql
            database__connection__host: db
            database__connection__user: ghost
            database__connection__password: ${DB_PASSWORD}
            database__connection__database: ghost
          volumes:
            - content:/var/lib/ghost/content
          x-provelox:
            expose: true
            port: 2368
        db:
          image: mysql:8.0
          restart: unless-stopped
          environment:
            MYSQL_DATABASE: ghost
            MYSQL_USER: ghost
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
          volumes:
            - dbdata:/var/lib/mysql
          healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
      volumes:
        content:
        dbdata:

  # ---------------------------------------------------------------------------------------------------------------
  - id: paperless-ngx
    name: Paperless-ngx
    description: "Scan, index and archive your paper documents, with full-text search. With PostgreSQL and a Redis broker."
    category: Productivity
    icon: https://cdn.simpleicons.org/paperlessngx
    mainService: paperless
    port: 8000
    publicWeb: true
    variables:
      - key: PAPERLESS_ADMIN_USER
        label: Admin username
        default: admin
      - key: PAPERLESS_ADMIN_PASSWORD
        label: Admin password
        description: "The first login. Generated; change it in Paperless afterwards if you like."
        kind: secret
      - key: PAPERLESS_SECRET_KEY
        label: Secret key
        description: "Signs sessions. Generated."
        kind: secret
      - key: PAPERLESS_URL
        label: Public address (optional)
        description: "The full address, like https://docs.example.com. Needed for sign-in over a domain (it sets the trusted origins). Add the domain under the app's Networking after deploying."
        default: ""
      - key: PAPERLESS_TIME_ZONE
        label: Time zone
        default: UTC
      - { key: DB_PASSWORD, label: Database password, kind: secret }
    compose: |
      services:
        paperless:
          image: ghcr.io/paperless-ngx/paperless-ngx:latest
          restart: unless-stopped
          depends_on: [db, broker]
          environment:
            PAPERLESS_REDIS: redis://broker:6379
            PAPERLESS_DBHOST: db
            PAPERLESS_DBNAME: paperless
            PAPERLESS_DBUSER: paperless
            PAPERLESS_DBPASS: ${DB_PASSWORD}
            PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
            PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER}
            PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
            PAPERLESS_URL: ${PAPERLESS_URL}
            PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE}
          volumes:
            - data:/usr/src/paperless/data
            - media:/usr/src/paperless/media
            - export:/usr/src/paperless/export
            - consume:/usr/src/paperless/consume
          x-provelox:
            expose: true
            port: 8000
        db:
          image: postgres:17
          restart: unless-stopped
          environment:
            POSTGRES_USER: paperless
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: paperless
          volumes:
            - pgdata:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
            interval: 10s
            timeout: 5s
            retries: 10
        broker:
          image: redis:7
          restart: unless-stopped
          volumes:
            - redisdata:/data
      volumes:
        data:
        media:
        export:
        consume:
        pgdata:
        redisdata:

  # ---------------------------------------------------------------------------------------------------------------
  - id: metabase
    name: Metabase
    description: "Ask questions of your data and share dashboards, no SQL required. Keeps its own settings in PostgreSQL."
    category: Analytics
    icon: https://cdn.simpleicons.org/metabase
    mainService: metabase
    port: 3000
    publicWeb: true
    variables:
      - { key: DB_PASSWORD, label: Database password, kind: secret }
    compose: |
      services:
        metabase:
          image: metabase/metabase:latest
          restart: unless-stopped
          depends_on: [db]
          environment:
            MB_DB_TYPE: postgres
            MB_DB_HOST: db
            MB_DB_PORT: "5432"
            MB_DB_DBNAME: metabase
            MB_DB_USER: metabase
            MB_DB_PASS: ${DB_PASSWORD}
          x-provelox:
            expose: true
            port: 3000
        db:
          image: postgres:17
          restart: unless-stopped
          environment:
            POSTGRES_USER: metabase
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: metabase
          volumes:
            - pgdata:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
            interval: 10s
            timeout: 5s
            retries: 10
      volumes:
        pgdata:

  # ---------------------------------------------------------------------------------------------------------------
  # Headless CMS
  # ---------------------------------------------------------------------------------------------------------------
  - id: directus
    name: Directus
    description: "A headless CMS and data platform: put a REST and GraphQL API and an admin app on top of your database. With PostgreSQL (PostGIS) and a Redis cache."
    category: CMS
    icon: https://cdn.simpleicons.org/directus
    mainService: directus
    port: 8055
    publicWeb: true
    variables:
      - key: ADMIN_EMAIL
        label: Admin email
        description: "The first login."
        default: admin@example.com
      - key: ADMIN_PASSWORD
        label: Admin password
        description: "Generated. Change it in Directus afterwards if you like."
        kind: secret
      - key: SECRET
        label: Secret key
        description: "Signs access tokens. Generated; changing it later signs everyone out."
        kind: secret
      - key: PUBLIC_URL
        label: Public address
        description: "Where Directus is reached from outside, like https://cms.example.com (or / for the same address it is opened at). Add the domain under the app's Networking after deploying."
        default: /
      - { key: DB_PASSWORD, label: Database password, kind: secret }
    compose: |
      services:
        directus:
          image: directus/directus:11
          restart: unless-stopped
          depends_on: [db, cache]
          environment:
            SECRET: ${SECRET}
            DB_CLIENT: pg
            DB_HOST: db
            DB_PORT: "5432"
            DB_DATABASE: directus
            DB_USER: directus
            DB_PASSWORD: ${DB_PASSWORD}
            CACHE_ENABLED: "true"
            CACHE_AUTO_PURGE: "true"
            CACHE_STORE: redis
            REDIS: redis://cache:6379
            ADMIN_EMAIL: ${ADMIN_EMAIL}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD}
            PUBLIC_URL: ${PUBLIC_URL}
          volumes:
            - uploads:/directus/uploads
            - extensions:/directus/extensions
          x-provelox:
            expose: true
            port: 8055
        db:
          image: postgis/postgis:17-3.5
          restart: unless-stopped
          environment:
            POSTGRES_USER: directus
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: directus
          volumes:
            - pgdata:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD", "pg_isready", "--host=localhost", "--username=directus"]
            interval: 10s
            timeout: 5s
            retries: 10
        cache:
          image: redis:7
          restart: unless-stopped
      volumes:
        uploads:
        extensions:
        pgdata:

  # ---------------------------------------------------------------------------------------------------------------
  - id: squidex
    name: Squidex
    description: "An open source headless CMS with a GraphQL and REST API, assets, workflows and multi-language content. With MongoDB."
    category: CMS
    mainService: squidex
    port: 80
    publicWeb: true
    variables:
      - key: URLS__BASEURL
        label: Public address
        description: "The full address Squidex is opened at, like https://cms.example.com. Squidex builds its sign-in and asset links from it and will not sign you in at any other address, so set the real one and add that domain under the app's Networking after deploying."
        default: http://localhost
      - key: IDENTITY__ADMINEMAIL
        label: Admin email
        default: admin@example.com
      - key: IDENTITY__ADMINPASSWORD
        label: Admin password
        description: "Choose one: at least 8 characters with an upper and a lower case letter, a number and a symbol, or Squidex will not create the admin."
        default: ""
    compose: |
      services:
        squidex:
          image: squidex/squidex:7
          restart: unless-stopped
          depends_on: [mongo]
          environment:
            URLS__BASEURL: ${URLS__BASEURL}
            EVENTSTORE__TYPE: MongoDB
            EVENTSTORE__MONGODB__CONFIGURATION: mongodb://mongo
            STORE__MONGODB__CONFIGURATION: mongodb://mongo
            IDENTITY__ADMINEMAIL: ${IDENTITY__ADMINEMAIL}
            IDENTITY__ADMINPASSWORD: ${IDENTITY__ADMINPASSWORD:?Choose an admin password}
          volumes:
            - assets:/app/Assets
          x-provelox:
            expose: true
            port: 80
        mongo:
          image: mongo:6
          restart: unless-stopped
          volumes:
            - mongodata:/data/db
      volumes:
        assets:
        mongodata:
