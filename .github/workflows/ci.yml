name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The end-to-end tests need a running Provelox: start them by hand with the address and password of one
  workflow_dispatch:
    inputs:
      console_url:
        description: URL of a running console to test
        required: true
      api_url:
        description: URL of that console's Provelox API (used only to clean up e2e-* apps)
        required: true

# Nothing here writes to the repository or the registry: a step that is compromised can only read
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless: stop it instead of paying for it
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which parts of the repository a change touches, so a docs fix does not run the platform's end-to-end tests
  # and a console change does not rebuild the docs. Changing this workflow runs everything.
  changes:
    name: What changed
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      console: ${{ steps.diff.outputs.console }}
      docs: ${{ steps.diff.outputs.docs }}
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          elif [ -n "${BEFORE:-}" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" HEAD)"
          else
            files="ALL"
          fi
          echo "Changed files:"; echo "$files" | head -50
          has() { [ "$files" = "ALL" ] || echo "$files" | grep -qE "$1"; }
          # this workflow changing is a reason to run everything
          if has '^\.github/workflows/ci\.yml$'; then files="ALL"; fi
          out() { if has "$2"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }
          out api '^api/'
          out console '^console/'
          out docs '^docs/'
          # the shipped image holds the API, console and the installer: any of them can break it
          out e2e '^(api|console|scripts)/|^Dockerfile|^\.dockerignore'

  api:
    name: API
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.api == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      # Unit and HTTP tests run against a fake Docker. The real-Docker suites (npm run test:docker) need a Swarm.
      - run: npm test
      - run: npm run build

  console:
    name: Console
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.console == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console
    env:
      # The build reads its settings at start; these are placeholders that point nowhere
      PROVELOX_API_URL: http://localhost:1
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: console/.nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx prettier --check src tests e2e
      - run: npm test
      - run: npm run build

  docs:
    name: Documentation site
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.docs == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      # A dead link or a broken page fails the build
      - run: npm run build

  # The whole platform, for real: build the image, install it on this runner's own Docker Swarm, and drive the console
  # with a browser. This also proves that the install works from the image alone.
  e2e:
    name: End-to-end
    # After the fast checks, and only when they did not fail: a skipped one (nothing changed there) is fine
    needs: [changes, api, console]
    if: >-
      github.event_name != 'workflow_dispatch' && needs.changes.outputs.e2e == 'true' &&
      !failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ROOT_DOMAIN: provelox.localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: console/.nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json
      # This also proves the image builds, so there is no separate build job. Layers are cached between runs.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: provelox:ci
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max
      - name: Install Provelox
        run: |
          # a throwaway password for this run only
          PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"
          echo "E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -e PVX_ADMIN_PASSWORD="$PASSWORD" \
            provelox:ci install --root-domain "$ROOT_DOMAIN" --image provelox:ci
          # *.localhost is not resolved by every resolver on a runner: say where the platform's hosts are
          echo "127.0.0.1 api.$ROOT_DOMAIN console.$ROOT_DOMAIN" | sudo tee -a /etc/hosts
      - name: Wait for the platform
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://api.$ROOT_DOMAIN/health" && curl -fsS -o /dev/null "http://console.$ROOT_DOMAIN/login"; then
              echo "up after $((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "The platform did not come up"; exit 1
      - run: npm ci
        working-directory: console
      - run: npx playwright install --with-deps chromium
        working-directory: console
      - run: npx playwright test
        working-directory: console
        env:
          E2E_BASE_URL: http://console.${{ env.ROOT_DOMAIN }}
          E2E_API_URL: http://api.${{ env.ROOT_DOMAIN }}
          E2E_CHANNEL: bundled
      - name: What the platform said
        if: failure()
        run: |
          docker service ls || true
          for s in $(docker service ls --format '{{.Name}}'); do echo "--- $s"; docker service logs --tail 60 "$s" 2>&1 || true; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            console/playwright-report
            console/test-results

  e2e-external:
    name: End-to-end (running instance)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: console/.nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_BASE_URL: ${{ inputs.console_url }}
          E2E_API_URL: ${{ inputs.api_url }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_CHANNEL: bundled
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            console/playwright-report
            console/test-results
