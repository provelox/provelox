name: Docs image

# Builds the documentation site (docs/) into an image and publishes it as ghcr.io/provelox/docs for amd64 and arm64:
# `latest` and `sha-<commit>` on every change to main. Pull requests that change the docs build the image and test it, and
# publish nothing. It runs only in the public repository (docs/ is public; the private repository mirrors to it).
# The image runs as an app (container port 80) behind the docs address. On a push to main, once the image is published,
# the `deploy` job rolls that app onto the new `sha-<commit>` image with the provelox/deploy action and waits for it to be
# running. It runs only when the repository variable DEPLOY_DOCS is `true`, and needs, in this repository's
# Settings -> Secrets and variables -> Actions:
#   secret   PROVELOX_DEPLOY_KEY    the deploy key of the docs app (made in its Deployments tab; shown once)
#   secret   PROVELOX_SERVER_URL    the Provelox API address, api.<root domain> by default (not the console's)
#   variable DEPLOY_DOCS            `true` to switch the deploy on
# This repository is public and so are its run logs: the address is a secret so that it is masked there. A variable would
# be printed in plain text.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs-image.yml']
  pull_request:
    paths: ['docs/**', '.github/workflows/docs-image.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/provelox/docs

jobs:
  image:
    name: Build, test, publish
    if: github.repository == 'provelox/provelox'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.deploytag.outputs.value }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # the tag the deploy job rolls onto: the same short commit tag the metadata step publishes
      - name: Tag to deploy
        id: deploytag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # One platform, loaded into the local Docker so it can be run and asked for pages before anything is published
      - name: Build the image for the test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docs
          load: true
          tags: docs-test
          cache-from: type=gha,scope=docs
          cache-to: type=gha,scope=docs,mode=max
      - name: Run it and ask for pages
        run: |
          set -eu
          docker run -d --name docs-test -p 8080:80 docs-test
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/ > /dev/null && break; sleep 1; done
          # clean addresses work, and the page is the real one
          curl -fsS http://localhost:8080/guide/install | grep -q "Install Provelox"
          # the folder's own README is not a page, and a missing page is a 404
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/README)" = 404 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/no-such-page)" = 404 ]
          # search engines are told where the pages are
          curl -fsS http://localhost:8080/robots.txt | grep -q "Sitemap: https://docs.provelox.com/sitemap.xml"
          curl -fsS http://localhost:8080/sitemap.xml | grep -q "https://docs.provelox.com/guide/install"
          # every page names its own address
          curl -fsS http://localhost:8080/guide/install | grep -q 'rel="canonical" href="https://docs.provelox.com/guide/install"'
      - name: Show the log if it failed
        if: failure()
        run: docker logs docs-test || true

      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      # The build stage runs on the runner's own CPU (see docs/Dockerfile), so the arm64 image needs no emulation
      - name: Publish for amd64 and arm64
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docs
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=docs
      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Docs image"
            echo ""
            echo "Published: \`${{ steps.meta.outputs.tags }}\`" | tr '\n' ' '
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # A deploy key can only roll an app onto a new tag of the image it already runs, so this uses the commit tag, never
  # `latest`. It runs after the build, the tests against the running container and the publish, so only a tested image is
  # deployed. A pull request never deploys (it publishes nothing, and has no secrets when it comes from a fork).
  deploy:
    name: Deploy
    needs: image
    if: ${{ github.repository == 'provelox/provelox' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_DOCS == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: provelox/deploy@465d2e3d029094a0212d8fa88954cdb6d672ea4b # v1.0.1
        with:
          server-url: ${{ secrets.PROVELOX_SERVER_URL }}
          deploy-key: ${{ secrets.PROVELOX_DEPLOY_KEY }}
          image: ghcr.io/provelox/docs:${{ needs.image.outputs.tag }}
