name: DCO

# Every commit in a pull request must be signed off (git commit -s): see CONTRIBUTING.md

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Signed-off-by
    # Only the public repository asks for sign-offs, and dependency bumps from the bot carry none
    if: github.repository == 'provelox/provelox' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          bad=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by line"
              bad=1
            fi
          done
          [ "$bad" = 0 ] || { echo "Add one with: git rebase --signoff $BASE  (see CONTRIBUTING.md)"; exit 1; }
