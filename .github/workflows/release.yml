name: Publish image

# Images are built for releases only: a tag like v0.2.0 publishes 0.2.0, 0.2 and latest (a pre-release such as
# v0.5.0-rc.1 publishes only its own version). Merges to main are tested by CI but not built here.
#
# Each CPU family is built on a machine of that family, in parallel (the Arm build used to run under emulation, which
# was the slow part). Each build pushes its image by digest alone; the last job joins the two into one multi-platform
# image under the tags and checks that both platforms are in it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/provelox/provelox

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # The private repository is mirrored here; images are built from the public repository's own tags
    if: github.repository == 'provelox/provelox'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the version and the labels are used here; the tags are put on by the last job
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PROVELOX_VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Say how and from what this image was built, and what is in it, so it can be checked against the source
          provenance: mode=max
          sbom: true
          # One cache per CPU family: the layers differ, and neither should evict the other
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Keep the digest for the last job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish tags
    needs: build
    if: github.repository == 'provelox/provelox'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,format=short
      - name: Join the two builds under the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          # The tag options and the digests are lists on purpose: each word is one argument
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Check that both platforms are in the published image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          platforms=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[]? | select(.platform.os == "linux") | .platform.architecture] | unique | join(",")')
          echo "platforms: $platforms"
          [ "$platforms" = "amd64,arm64" ] || { echo "::error::expected amd64 and arm64, found: $platforms"; exit 1; }

  # The last step: a GitHub Release with the change log's notes for the version. For a release candidate it is marked
  # as a pre-release. Anyone (and the private repository's latest-release step) can see from it that the image exists.
  release:
    name: GitHub Release
    needs: publish
    if: github.repository == 'provelox/provelox'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "Provelox ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" $flags

